<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#e4e4e6">
  <title>2D Maps</title>
  <script>if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.classList.add('bt-map-dark');</script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #e4e4e6; font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    /* Applied before the shell mounts, including while runtime styles load. */
    header, .eventbar, #sidebar, .map-view-switch, .three-only { display: none !important; }
    #workspace { position: fixed; inset: 0; display: block !important; width: 100%; height: 100%; }
    #map-area { width: 100%; height: 100%; margin: 0; }
    .bt-fail { display: grid; justify-items: center; gap: 8px; max-width: 320px; padding: 28px 24px 20px; border-radius: 28px; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .04), 0 12px 32px -6px rgb(0 0 0 / .1); text-align: center; font-family: Geist, Inter, system-ui, sans-serif; }
    .bt-fail h2 { margin: 0; font: 500 20px/28px Geist, Inter, system-ui, sans-serif; color: #18181b; }
    .bt-fail p { margin: 0 0 8px; font: 400 14px/20px Geist, Inter, system-ui, sans-serif; color: #71717a; }
    .bt-fail button { height: 40px; padding: 0 20px; border: 0; border-radius: 36px; background: #97dd62; color: #051b35; font: 500 14px/20px Geist, Inter, system-ui, sans-serif; cursor: pointer; }
    .bt-fail small { margin-top: 8px; font: 400 12px/16px ui-monospace, monospace; color: #a1a1aa; }
    /* dark theme from the first paint: page, loader and the load-error card */
    html.bt-map-dark, html.bt-map-dark body, html.bt-map-dark #boot-loader { background: #18191b; color: #d7dbe3; }
    html.bt-map-dark .bt-fail { background: #1c1d21; box-shadow: inset 0 0 1px rgb(255 255 255 / .3), 0 14px 28px rgb(0 0 0 / .35); }
    html.bt-map-dark .bt-fail h2 { color: #fcfcfc; }
    html.bt-map-dark .bt-fail p, html.bt-map-dark .bt-fail small { color: #a4a6ad; }
    [hidden], dialog:not([open]) { display: none !important; }
    #seat-popup:empty, #map-hover-card:empty, #toast:empty { display: none !important; }
    body.map-loading #seat-popup, body.map-loading #map-hover-card, body.map-loading #toast, body.map-loading .section-annotation-layer { visibility: hidden !important; }
    #boot-loader { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #e4e4e6; color: #344054; }
  </style>
</head>
<body class="player-only map-loading">
  <div id="boot-loader" role="alert" hidden></div>
  <!-- the graphics library is needed by every map: start fetching it with the page, not after the seat map has arrived -->
  <link rel="modulepreload" href="runtime/vendor/three.module.js">
  <script type="module" src="app.js"></script>
</body>
</html>
